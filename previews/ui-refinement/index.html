const x=document.querySelector('canvas').getContext('2d');const scene=new URLSearchParams(location.search).get('scene')||'panou';const E=k=>1-Math.pow(1-Math.max(0,Math.min(1,k)),3);let start=performance.now();
function box(a,b,w,h,r=16,fill='#171e29',stroke='#ffffff16'){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=1;x.stroke()}}
function txt(s,a,b,size=16,color='#dbe6f5',weight=400,align='left'){x.font=`${weight} ${size}px Segoe UI`;x.fillStyle=color;x.textAlign=align;x.fillText(s,a,b)}
function card(a,b,w,h,active=false){let g=x.createLinearGradient(a,b,a,b+h);g.addColorStop(0,active?'#18314d':'#20232b');g.addColorStop(1,active?'#111f30':'#13151c');box(a,b,w,h,18,g,active?'#4283bc70':'#ffffff1b')}
function button(s,a,b,w=150,primary=false){box(a,b,w,39,13,primary?'#0787ff':'#202633',primary?'#3ba5ff':'#ffffff20');txt(s,a+w/2,b+25,12,'#f2f7ff',650,'center')}
function cursor(a,b,click){x.save();x.translate(a,b);x.beginPath();x.moveTo(0,0);x.lineTo(0,19);x.lineTo(5,14);x.lineTo(10,24);x.lineTo(14,22);x.lineTo(9,12);x.lineTo(17,12);x.closePath();x.fillStyle='#fff';x.strokeStyle='#142942';x.lineWidth=2;x.fill();x.stroke();if(click>0&&click<1){x.beginPath();x.arc(4,6,8+click*20,0,Math.PI*2);x.strokeStyle=`rgba(107,190,255,${1-click})`;x.stroke()}x.restore()}
function shell(title,subtitle){x.fillStyle='#0b0d13';x.fillRect(0,0,1280,720);let g=x.createLinearGradient(0,0,210,720);g.addColorStop(0,'#202229');g.addColorStop(1,'#111319');x.fillStyle=g;x.fillRect(0,0,210,668);x.fillStyle='#ffffff14';x.fillRect(209,0,1,668);txt('Study',23,38,22,'#f7f9ff',750);txt('X',79,38,22,'#249cff',750);box(20,64,37,37,12,'#168bff',null);txt('A',38,89,17,'white',700,'center');txt('Profil demonstrativ',69,82,12,'#edf3fc',600);txt('STUDENT LA MEDICINĂ',69,100,8,'#8693a4',600);txt('STUDIU',22,147,9,'#6e7b90',700);const names=['Panou','Toate grilele','Recapitulare','Sesiune zilnică','Statistici','Realizări','Perspective AI'];names.forEach((s,n)=>{const active=n===(scene==='studiu'?1:0);if(active)box(12,160+n*43,186,37,12,'#12263c','#2272aa');txt(['◈','▦','↻','◉','▥','☆','↗'][n],29,184+n*43,17,active?'#41a9ff':'#819bbf');txt(s,60,183+n*43,12,active?'#eff7ff':'#b4becd',active?650:500)});txt('RESURSE',22,497,9,'#6e7b90',700);txt('▤    Notițe',29,535,12,'#b4becd');txt('⚙    Setări',29,610,12,'#b4becd');txt('◐    Aspect',29,644,12,'#b4becd');txt(title,260,71,28,'#f5f8ff',750);txt(subtitle,260,97,13,'#8e9fb8');x.fillStyle='#080c14';x.fillRect(0,668,1280,52);txt('STUDYX · CONCEPT DE RAFINARE',27,699,10,'#69a7dc',650);txt(scene==='panou'?'Accent pe activitatea zilei · aceeași navigare':scene==='studiu'?'Selecție clară · feedback stabil · pașii actuali':'Ajutor scurt la cerere · ghidul rămâne opțional',1250,699,12,'#8b9db5',400,'right')}

function help(t){dashboard(0.9);box(916,211,22,22,11,'#1d3550','#537ba1');txt('?',927,227,13,'#aecded',700,'center');const open=E((t-1.4)/.35),tour=E((t-4.2)/.4);if(open){x.save();x.globalAlpha=open;if(tour<.01){card(866,251,337,182,true);txt('Cum încep sesiunea de azi?',885,280,15,'#edf5ff',650);txt('Apasă „Începe” pentru sesiunea ghidată.',885,310,12,'#b4cbe5');txt('Progresul apare apoi în Panou.',885,333,12,'#b4cbe5');x.fillStyle='#527ba140';x.fillRect(885,348,299,1);button('Vezi ghidul →',885,365,158,true);txt('Închide',1146,391,11,'#a1b8d3',500,'center')}x.restore()}if(tour>0){x.save();x.globalAlpha=tour;x.fillStyle='#03091499';x.fillRect(210,108,1070,548);card(260,194,962,95,true);txt('ACTIVITATEA ZILEI',283,220,10,'#75b9ef',700);txt('Un ritm bun începe cu următoarea sesiune.',283,247,20,'#edf5ff',650);txt('Continuă de unde ai rămas, în ritmul tău.',283,269,12,'#94b0d0');button('ÎNCEPE  ↗',1056,222,137,true);x.strokeStyle='#65b7ff';x.lineWidth=1.5;x.beginPath();x.roundRect(255,189,972,105,22);x.stroke();card(782,318,420,208,true);txt('GHID · 1 / 3',803,347,10,'#78bded',700);txt('Activitatea ta de azi',803,379,22,'#eff6ff',650);txt('Aici găsești punctul de pornire al sesiunii.',803,407,13,'#b6cbe3');txt('Ghidul explică pașii. Tu alegi când începi.',803,432,13,'#b6cbe3');button('Mai departe →',1001,465,177,true);txt('Închide ghidul',854,490,11,'#a2b9d7',500,'center');x.restore()}cursor(t<2?927:t<4?981:1090,t<2?224:t<4?387:481,(t>1.4&&t<1.9)?(t-1.4)*2:0)}
window.renderAt=t=>{if(scene==='studiu')study(t);else if(scene==='ghidaj')help(t);else dashboard(t)};function loop(now){window.renderAt(((now-start)/1000)%8);requestAnimationFrame(loop)}requestAnimationFrame(loop);
